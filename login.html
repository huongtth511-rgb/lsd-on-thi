<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <title>Đăng nhập • Lịch sử Đảng</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#10233c;background:#f3f6f9;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top left,#dcefeb,transparent 65%),#f3f6f9}
    main{width:100%;max-width:440px;background:#fff;border:1px solid #dde6eb;border-radius:24px;padding:36px;box-shadow:0 20px 70px #10233c10}
    .icon{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:#e7f5f3;font-size:27px;margin-bottom:24px}
    .eyebrow{color:#0a7c78;text-transform:uppercase;font-size:11px;font-weight:750;letter-spacing:.14em}
    h1{font-size:29px;letter-spacing:-.03em;margin:10px 0}p{font-size:14px;line-height:1.65;color:#66768a;margin:0 0 26px}
    label{display:block;font-size:13px;font-weight:650;margin:18px 0 8px}input{width:100%;border:1px solid #c9d8e0;border-radius:10px;padding:12px;font:inherit;background:#fff;color:#10233c}
    input:focus{outline:3px solid #0a7c7830;border-color:#0a7c78}button{margin-top:24px;min-height:48px;width:100%;border:0;border-radius:10px;background:#0a7c78;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    button:hover{background:#086864}button:focus-visible{outline:3px solid #dca34d;outline-offset:3px}.error{background:#fff0ed;color:#a03945;border-radius:10px;padding:12px;font-size:13px;margin:20px 0 0}.error:empty{display:none}
    footer{border-top:1px solid #e7edf1;padding-top:20px;margin-top:26px;color:#66768a;font-size:12px;line-height:1.6}@media(max-width:480px){main{padding:26px}body{padding:16px}}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📚</div>
    <div class="eyebrow">Học · Luyện · Ghi nhớ</div>
    <h1>Chào mừng trở lại</h1>
    <p>Đăng nhập để tiếp tục ôn thi Lịch sử Đảng.</p>
    <div class="error" role="alert">{{ERROR}}</div>
    <form action="/login" method="post">
      <input type="hidden" name="csrf" value="{{CSRF}}">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" autocomplete="username" required maxlength="100" autocapitalize="none" spellcheck="false" autofocus>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
      <button type="submit">Đăng nhập →</button>
    </form>
    <footer>3 chương · 9 bộ trắc nghiệm<br>Tiến độ học được lưu riêng trên trình duyệt của bạn.</footer>
  </main>
</body>
</html>
